# -------------------------
# HTTP server (port 80)
# Handles ACME + redirects to HTTPS
# -------------------------
server {
    listen 80;
    server_name leonwigley.com www.leonwigley.com;

    # Enable ACME for automatic HTTPS
    acme_http01 on;

    # Redirect all HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }

    access_log /var/log/nginx/leonwigley.com.access.log;
    error_log /var/log/nginx/leonwigley.com.error.log;
}

# -------------------------
# HTTPS server (port 443)
# Reverse proxy to Rust app + automatic certificates
# -------------------------
server {
    listen 443 ssl;
    server_name leonwigley.com www.leonwigley.com;

    # Nginx automatically manages these certs
    acme_certificate /etc/nginx/ssl/leonwigley.com;

    ssl_certificate     /etc/nginx/ssl/leonwigley.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/leonwigley.com/key.pem;

    # Reverse proxy to your Rust app
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    access_log /var/log/nginx/leonwigley.com.access.log;
    error_log /var/log/nginx/leonwigley.com.error.log;
}
