<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Leon Wigley</title>

  <meta name="description"
    content="Leon Wigley's thoughts on programming, life and business. Thoughts and lessons learned." />
  <meta name="keywords"
    content="programming, coding, software development, personal blog, business, entrepreneurship, life lessons, productivity" />
  <meta name="author" content="Leon Wigley" />

  <link rel="icon" href="/images/favicon.jpg" type="image/jpeg" />
  <link rel="shortcut icon" href="/images/favicon.jpg" type="image/jpeg" />
  <link rel="apple-touch-icon" href="/images/favicon.jpg" />

  <link rel="stylesheet" href="/css/styles.css" />
  <style>
    /* Ensure the canvas doesn't interfere with your links */
    #three-canvas {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 200px;
      pointer-events: none;
      /* Let clicks pass through to footer links */
      z-index: -1;
      /* Keep it behind your text if they overlap */
    }
  </style>

  {% block head %}{% endblock head %}

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "PointerLockControls": "https://unpkg.com/three@0.160.0/examples/jsm/controls/PointerLockControls.js"
      }
    }
  </script>
</head>

<body>
  {% block content %}{% endblock content %}

  {% if show_background | default(value=true) %}
  <canvas id="three-canvas"></canvas>

  <script type="module">
    import * as THREE from 'three';

    const canvas = document.querySelector('#three-canvas');
    const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
    renderer.setPixelRatio(window.devicePixelRatio);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, canvas.clientWidth / canvas.clientHeight, 0.1, 1000);
    camera.position.z = 3;

    // A cool geometric shape
    const geometry = new THREE.IcosahedronGeometry(1.5, 0);
    const material = new THREE.MeshNormalMaterial({ wireframe: true });
    const mesh = new THREE.Mesh(geometry, material);
    scene.add(mesh);

    function resize() {
      const width = canvas.clientWidth;
      const height = canvas.clientHeight;
      if (canvas.width !== width || canvas.height !== height) {
        renderer.setSize(width, height, false);
        camera.aspect = width / height;
        camera.updateProjectionMatrix();
      }
    }

    function animate(time) {
      resize();

      // Floating animation
      mesh.rotation.y = time / 2000;
      mesh.rotation.x = time / 3000;
      mesh.position.y = Math.sin(time / 1500) * 0.2;

      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }

    requestAnimationFrame(animate);
  </script>
  {% endif %}
</body>

</html>
